<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">Codex Control Center</title>
  <desc id="desc">看清额度，接续工作。深墨与青绿色的项目品牌封面；装饰图形不代表软件界面或观测数据。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d141d"/><stop offset="1" stop-color="#142832"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#66dbc3" stop-opacity=".14"/><stop offset="1" stop-color="#66dbc3" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#a5c7cf" stroke-opacity=".045"/></pattern>
    <clipPath id="frame"><rect width="1280" height="320" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="320" fill="url(#background)"/>
    <rect width="1280" height="320" fill="url(#grid)"/>
    <ellipse cx="1090" cy="160" rx="330" ry="290" fill="url(#glow)"/>
    <circle cx="1160" cy="160" r="170" fill="none" stroke="#66dbc3" stroke-opacity=".12"/>
    <circle cx="1160" cy="160" r="120" fill="none" stroke="#66dbc3" stroke-width="32" stroke-opacity=".045"/>
    <path d="M1160 40a120 120 0 1 0 104 180" fill="none" stroke="#66dbc3" stroke-width="2" stroke-linecap="round" stroke-opacity=".4"/>
    <circle cx="1264" cy="220" r="6" fill="#66dbc3" fill-opacity=".7"/>
    <path d="M78 266H1202" stroke="#66dbc3" stroke-opacity=".15"/>
    <!-- C mark faithfully reuses src-tauri/icons/source.svg geometry. -->
    <g transform="translate(64 94) scale(.24)">
      <rect x="16" y="16" width="480" height="480" rx="120" fill="#18232c" stroke="#354c53" stroke-width="4"/>
      <path d="M347 157a126 126 0 1 0 0 198" fill="none" stroke="#66dbc3" stroke-width="58" stroke-linecap="round"/>
      <circle cx="347" cy="256" r="25" fill="#66dbc3"/>
    </g>
    <text x="214" y="145" fill="#f2f7fa" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="64" font-weight="650" letter-spacing="-2">Codex Control Center</text>
    <text x="216" y="201" fill="#a6c8c9" font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="34">看清额度，接续工作。</text>
  </g>
  <rect x=".5" y=".5" width="1279" height="319" rx="24" fill="none" stroke="#29414b"/>
</svg>
