[package]
name = "codex-control-center"
version = "0.1.0"
description = "Local-first Windows control center for Codex"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "=2.5.2"
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-notification = "=2.5.1"
tauri-plugin-window-state = "=2.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "io-std", "time", "sync", "rt-multi-thread"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
